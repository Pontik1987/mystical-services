<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Редактировать услугу — Mystical Services</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header class="topbar">
        <a href="{{ url_for('index') }}" class="logo">Mystical Services</a>
        <div class="user-info">
            <a href="{{ url_for('profile', username=session.username) }}" class="user-link">← В профиль</a>
            <button class="theme-toggle" onclick="toggleTheme()" title="Тема">🌙</button>
            <a href="{{ url_for('logout') }}" class="btn-logout">Выйти</a>
        </div>
    </header>

    <main class="feed-container">
        <div class="edit-card">
            <h2>✏️ Редактировать услугу</h2>

            {% with messages = get_flashed_messages() %}
                {% if messages %}
                    {% for msg in messages %}
                        <div class="flash">{{ msg }}</div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <form method="POST">
                <label class="form-label">Название услуги *</label>
                <input type="text" name="name" class="form-input" maxlength="100" required value="{{ service.name }}">

                <label class="form-label">Категория</label>
                <select name="category" class="form-input">
                    <option value="beauty" {% if service.category == 'beauty' %}selected{% endif %}>💅 Бьюти</option>
                    <option value="auto" {% if service.category == 'auto' %}selected{% endif %}>🚗 Авто</option>
                    <option value="home" {% if service.category == 'home' %}selected{% endif %}>🏠 Быт</option>
                    <option value="it" {% if service.category == 'it' %}selected{% endif %}>💻 IT</option>
                    <option value="education" {% if service.category == 'education' %}selected{% endif %}>📚 Образование</option>
                    <option value="creative" {% if service.category == 'creative' %}selected{% endif %}>🎨 Творчество</option>
                    <option value="other" {% if service.category == 'other' %}selected{% endif %}>📦 Другое</option>
                </select>

                <label class="form-label">Цена (BYN)</label>
                <input type="number" name="price" class="form-input" min="0" max="100000" value="{{ service.price }}">

                <label class="form-label">Длительность (минут)</label>
                <input type="number" name="duration" class="form-input" min="15" max="480" value="{{ service.duration }}">

                <label class="form-label">Описание</label>
                <textarea name="description" id="edit-service-desc" class="form-textarea" maxlength="500">{{ service.description or '' }}</textarea>
                <button type="button" class="emoji-trigger" data-target="edit-service-desc" title="Эмодзи" style="margin-top:6px;">😀 Эмодзи</button>

                <div class="edit-actions">
                    <button type="submit" class="btn-primary">Сохранить</button>
                    <a href="{{ url_for('profile', username=session.username) }}" class="btn-secondary">Отмена</a>
                </div>
            </form>
        </div>
    </main>

    <script src="{{ url_for('static', filename='emoji.js') }}"></script>
    <script src="{{ url_for('static', filename='theme.js') }}"></script>
</body>
</html>
